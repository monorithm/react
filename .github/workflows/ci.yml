# CI: the checks of @monorithm/react on each pull request and each push to main.
#   check       the pinned language (ir/ matches language.lock) and the drift check of the generated tokens
#   typecheck   TypeScript
#   test        the clause tests in jsdom, and the browser tests in the Chrome of the runner (no browser download)
#   build       the library
# Each action has a full commit SHA and a comment with its version.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check, type check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Node 26 does not include Corepack. Corepack reads the field packageManager of package.json.
      - name: Install Corepack
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install the dependencies
        run: yarn install --immutable

      - name: Check the pinned language and the generated tokens
        run: yarn check

      - name: Type check
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
